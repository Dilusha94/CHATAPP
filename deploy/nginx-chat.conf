# /etc/nginx/sites-available/chat   (setup.sh replaces CHAT_DOMAIN)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream chat_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name CHAT_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;          # Ubuntu 24.04 ships nginx 1.24
    listen [::]:443 ssl http2;
    server_name CHAT_DOMAIN;

    ssl_certificate     /etc/ssl/cf/origin.pem;
    ssl_certificate_key /etc/ssl/cf/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;
    access_log off;                      # privacy + less disk I/O
    error_log /var/log/nginx/chat_error.log warn;

    location / {
        proxy_pass http://chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
